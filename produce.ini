[datasets/SNLI_5_anno]
recipe = 
    mkdir -p datasets/SNLI_5_anno
    for f in `ls datasets/SNLI_5_anno_org/*.jsonl | xargs -n 1 basename`
    do
        python3 scripts_other/nlidata2prolog.py  datasets/SNLI_5_anno_org/$f  datasets/SNLI_5_anno/${f/.jsonl/_sen.pl} --fmt sen.pl  --tokenize native  --corpus snlijson
    done
    echo "--sen done--"

    for f in `ls datasets/SNLI_5_anno_org/*.jsonl | xargs -n 1 basename`
    do
        python3 scripts_other/nlidata2prolog.py   datasets/SNLI_5_anno_org/$f  datasets/SNLI_5_anno/${f/jsonl/spl} --fmt spl  --tokenize native --corpus snlijson
    done
    echo "--spl done--"

    for f in `ls datasets/SNLI_5_anno/*.spl | xargs -n 1 basename`
    do
        # --candc-int-dict_cutoffs="20 20 20 20 150 200 500" --candc-int-betas="0.075 0.03 0.01 0.005 0.001 0.0005 0.00001"
        cat datasets/SNLI_5_anno/$f | ../candc/candc/bin/candc --models ../candc/models/models --output datasets/SNLI_5_anno/${f/.spl/_ccg.pl}  --candc-printer boxer --candc-parser-noisy_rules=false 2> datasets/SNLI_5_anno/${f/.spl/_output.txt} 
        echo "${f/.spl/_cc_ccg.pl} Done"
        grep -o -i failed datasets/SNLI_5_anno/${f/.spl/_output.txt}  | wc -l
    done
    echo "---ccg done---"

