######################## Functions #####################
[]
prelude =
    langpro_path = "../LangProAbd/"

    def part_to_sick_filename(part):
        d = {'trial': 'SICK_trial',
             'train': 'SICK_train',
             'test':  'SICK_test_annotated',
             'test_annotated':  'SICK_test_annotated',
             'train_trial': 'SICK_train_trial'
            }
        if "snli" in part or part not in d:
            return part
        else:
            return d[part]

    def sen_filename(part):
        if "snli" in part:
            return f"sen_fix"
        else:
            return f"sen"


