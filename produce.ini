############################# LangPro Debug script ##################################
# runs SNLI part from in range (prob, prob2, step). 
# Useful to find where LangPro gets stuck time wise or breaks wihtout losing big progress
[SNLI_max-%{part}-%{prob}_%{prob2}_%{step}]
main = %{langpro_path}/prolog/main.pl
sen = datasets_ccg/SNLI_NN/%{ part_to_sick_filename(part) }_%{sen_filename(part)}.pl
parser_pl = datasets_ccg/SNLI_NN/%{ part_to_sick_filename(part) }_ccg.pl
wn =  %{langpro_path}/WNProlog/wn.pl
log = results/SNLI_NN/debug/%{ part_to_sick_filename(part) }_DEBUG.log
ans = results/SNLI_NN/debug/%{ part_to_sick_filename(part) }_DEBUG.ans
low_prob = %{int(prob)} 
high_prob = %{int(prob2)} 
range = %{int(step)}
recipe =
    echo %{prob} %{prob2} , step range %{step}

    mkdir -p results/SNLI_NN/debug/

    i_low=%{low_prob}
    i=$(($i_low + %{range}))
    while ((i<=%{high_prob})); do
        echo $i_low $i 
        START_TIME=$SECONDS

        ( time swipl -g "parList([parallel(_), prprb, aall, wn_ant, wn_sim, wn_der, constchk, ral(800), allInt, waif('%{ans}_$i_low-$i')]), entail_some($i_low-$i)" -t halt -f %{main}  %{parser_pl} %{sen} %{wn} ) > %{log}_$i_low-$i 2>&1
        STOP_TIME=$(( SECONDS - START_TIME ))
        echo $STOP_TIME
        echo "-----------"
        i_low=$i
        i=$(($i + %{range}))
    done
    echo $i_low %{high_prob}
    START_TIME=$SECONDS
    ( time swipl -g "parList([parallel(_), prprb, aall, wn_ant, wn_sim, wn_der, constchk, ral(800), allInt, waif('%{ans}_$i_low-%{high_prob}')]), entail_some($i_low-%{high_prob})" -t halt -f %{main}  %{parser_pl} %{sen} %{wn} ) > %{log}_$i_low-%{high_prob} 2>&1
    STOP_TIME=$(( SECONDS - START_TIME ))
    echo $STOP_TIME
    echo "-----------"

