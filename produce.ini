########################### Parse SNLI ##############################
# make CCG and sentence fix files
[datasets_ccg/SNLI_NN]
recipe = 
    mkdir -p datasets_ccg/SNLI_NN
    for f in `ls datasets_original/SNLI_NN/*_NN.jsonl | xargs -n 1 basename`
    do
        python3 scripts_other/nlidata2prolog.py  datasets_original/SNLI_NN/$f  datasets_ccg/SNLI_NN/${f/.jsonl/_sen.pl} --fmt sen.pl  --tokenize native  --corpus snlijson
    done
    echo "--sen done--"

    for f in `ls datasets_original/SNLI_NN/*_NN.jsonl | xargs -n 1 basename`
    do
        python3 scripts_other/nlidata2prolog.py   datasets_original/SNLI_NN/$f  datasets_ccg/SNLI_NN/${f/jsonl/spl} --fmt spl  --tokenize native --corpus snlijson
    done
    echo "--spl done--"

    for f in `ls datasets_ccg/SNLI_NN/*.spl | xargs -n 1 basename`
    do
        # --candc-int-dict_cutoffs="20 20 20 20 150 200 500" --candc-int-betas="0.075 0.03 0.01 0.005 0.001 0.0005 0.00001"
        cat datasets_ccg/SNLI_NN/$f | ../candc/candc/bin/candc --models ../candc/models/models --output datasets_ccg/SNLI_NN/${f/.spl/_ccg.pl}  --candc-printer boxer --candc-parser-noisy_rules=false 2> datasets_ccg/SNLI_NN/${f/.spl/_output.txt} 
        echo "${f/.spl/_cc_ccg.pl} Done"
        grep -o -i failed datasets_ccg/SNLI_NN/${f/.spl/_output.txt}  | wc -l
    done
    echo "---ccg done---"

    python scripts_other/comment_SNLI_problems.py

