[langpro_RUN]
recipe = 
    echo "parList([parts(['train']), parallel(_), prprb, aall, wn_ant, wn_sim, wn_der, constchck, allInt])."
    swipl -f %{langpro_path}/prolog/main.pl %{langpro_path}/WNProlog/wn.pl datasets/SNLI_5_anno/snli_1.0_train_5_anno_sen.pl datasets/SNLI_5_anno/snli_1.0_train_5_anno_ccg.pl

[SNLI_max_%{prob}_%{prob2}_%{step}]
main = %{langpro_path}/prolog/main.pl
sen = datasets/SNLI_5_anno/snli_1.0_train_5_anno_sen.pl
parser_pl = datasets/SNLI_5_anno/snli_1.0_train_5_anno_ccg.pl
wn =  %{langpro_path}/WNProlog/wn.pl
log = results/SNLI_5_anno/debug/snli_1.0_train_5_anno_DEBUG.log
ans = results/SNLI_5_anno/debug/snli_1.0_train_5_anno_DEBUG.ans
low_prob = %{int(prob)} 
high_prob = %{int(prob2)} 
range = %{int(step)}
recipe =
    echo %{prob} %{prob2} , step range %{step}

    mkdir -p results/SNLI_5_anno/debug/

    i_low=%{low_prob}
    i=$(($i_low + %{range}))
    while ((i<=%{high_prob})); do
        echo $i_low $i 
        START_TIME=$SECONDS

        ( time swipl -g "parList([parallel(_), prprb, aall, wn_ant, wn_sim, wn_der, constchk, ral(2), allInt, waif('%{ans}_$i_low-$i')]), entail_some($i_low-$i)" -t halt -f %{main}  %{parser_pl} %{sen} %{wn} ) > %{log}_$i_low-$i 2>&1
        STOP_TIME=$(( SECONDS - START_TIME ))
        echo $STOP_TIME
        echo "-----------"
        i_low=$i
        i=$(($i + %{range}))
    done
    echo $i_low %{high_prob}
    START_TIME=$SECONDS
    ( time swipl -g "parList([parallel(_), prprb, aall, wn_ant, wn_sim, wn_der, constchk, ral(2), allInt, waif('%{ans}_$i_low-%{high_prob}')]), entail_some($i_low-%{high_prob})" -t halt -f %{main}  %{parser_pl} %{sen} %{wn} ) > %{log}_$i_low-%{high_prob} 2>&1
    STOP_TIME=$(( SECONDS - START_TIME ))
    echo $STOP_TIME
    echo "-----------"

